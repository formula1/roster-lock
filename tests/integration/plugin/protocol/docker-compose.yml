services:
  http:
    build:
      context: ../../../../plugins/download/protocol/http/test
      dockerfile: test.Dockerfile
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/archive.tar.gz"]
      interval: 3s
      timeout: 5s
      retries: 10

  ftp:
    build:
      context: ../../../../plugins/download/protocol/ftp/test
      dockerfile: test.Dockerfile
    ports:
      - "12021:21"
      - "21000-21010:21000-21010"

  git:
    build:
      context: ../../../../plugins/download/protocol/git/test
      dockerfile: test.Dockerfile
    ports:
      - "13000:3000"

  torrent:
    build:
      context: ../../../../plugins/download/protocol/torrent/test
      dockerfile: test.Dockerfile
    environment:
      - WEBSEED_BASE_URL=http://localhost:19001
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

  ipfs:
    build:
      context: ../../../../plugins/download/protocol/ipfs/test
      dockerfile: test.Dockerfile
    ports:
      - "5001:5001"
      - "4001:4001"

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=roster-lock-test
      - MINIO_ROOT_PASSWORD=roster-lock-test-secret
    command: server /data
    ports:
      - "19100:9000"
