name = "titled-room-matchmaker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# Static assets (titled-room/client's own React matchmaker UI) - see
# index.ts's catch-all route. Mirrors core/relay-server/cloudflare's
# CLIENT_ASSETS binding for client-admin.
[assets]
binding = "CLIENT_ASSETS"
directory = "./client/dist"

[durable_objects]
bindings = [
  { name = "ROOM_SESSION", class_name = "RoomSession" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomSession"]

# Room browse index - RoomSession Durable Objects can't be enumerated, so
# this table (src/db/schema.sql) is what GET /room actually queries.
[[d1_databases]]
binding = "DB"
database_name = "roster-lock-titled-room-db"
database_id = "8c0daeb7-d695-4332-9444-c5e9301ffd4b" # local dev id; any UUID works for local persistence

[vars]
# Fixed relay server address rooms actually run on once started - never
# client-supplied. Point this at a real deployment before /room/start will
# work.
RELAY_SERVER_URL = "http://localhost:8788"
# What clients are actually told to connect to (see RoomSession.ts's
# GAME_HAS_STARTED broadcast) - distinct from RELAY_SERVER_URL above once a
# deployment's relay server has a different internal vs. public address
# (e.g. a docker-internal hostname vs. localhost - see examples/mugen's
# services/env-vars/internal-urls.env). Same value here since standalone dev
# has no such split.
PUBLIC_RELAY_SERVER_URL = "http://localhost:8788"

# MATCHMAKER_PUBLIC_KEY / MATCHMAKER_SECRET_KEY are this matchmaker's own
# signing identity (see relay-client.ts) - provision them with
# `wrangler secret put`, not here, and register the public half in
# relay-server's matchmakers table before /room/start will succeed.

# ikemen-go's game coordinator - see game-launchers.ts's gameCoordinatorFor.
# Unset entirely (the default here) means "no coordinator"; a deployment that
# needs one sets all three (see examples/mugen's internal-urls.env).
