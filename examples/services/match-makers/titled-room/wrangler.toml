name = "titled-room-matchmaker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[durable_objects]
bindings = [
  { name = "ROOM_SESSION", class_name = "RoomSession" }
]

[[migrations]]
tag = "v1"
new_classes = ["RoomSession"]

# Room browse index - RoomSession Durable Objects can't be enumerated, so
# this table (src/db/schema.sql) is what GET /room actually queries.
[[d1_databases]]
binding = "DB"
database_name = "roster-lock-titled-room-db"
database_id = "8c0daeb7-d695-4332-9444-c5e9301ffd4b" # local dev id; any UUID works for local persistence

[vars]
# Fixed relay server address rooms actually run on once started - never
# client-supplied. Point this at a real deployment before /room/start will
# work.
RELAY_SERVER_URL = "http://localhost:8788"

# Local-dev-only default (see admin/jwt.ts) - a real deployment provisions
# this with `wrangler secret put`, same as MATCHMAKER_SECRET_KEY below.
JWT_SECRET = "local-dev-titled-room-jwt-secret"
# Bootstraps the first `admins` row on its first successful login (see
# admin/index.ts) - which game-runner plugins this deployment allows is then
# managed via POST/PUT /admin/game-runners, not an env var.
INITIAL_ADMIN_USERNAME = "hello"
INITIAL_ADMIN_PASSWORD = "world"

# MATCHMAKER_PUBLIC_KEY / MATCHMAKER_SECRET_KEY are this matchmaker's own
# signing identity (see relay-client.ts) - provision them with
# `wrangler secret put`, not here, and register the public half in
# relay-server's matchmakers table before /room/start will succeed.
