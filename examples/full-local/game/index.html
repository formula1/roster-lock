<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match Lock Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        overflow: hidden;
      }

      #root {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .screen {
        display: none;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      
      .screen.active {
        display: flex;
      }
      
      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        max-width: 800px;
        width: 100%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      
      h1 {
        font-size: 2.5em;
        margin-bottom: 20px;
        text-align: center;
      }
      
      h2 {
        font-size: 1.8em;
        margin-bottom: 15px;
      }
      
      button {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        margin: 5px;
      }
      
      button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }
      
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      
      .status {
        text-align: center;
        margin: 20px 0;
        font-size: 1.2em;
      }
      
      .battle-field {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin: 20px 0;
      }
      
      .player-area {
        background: rgba(0, 0, 0, 0.2);
        padding: 20px;
        border-radius: 10px;
      }
      
      .health-bar {
        background: rgba(0, 0, 0, 0.3);
        height: 30px;
        border-radius: 15px;
        overflow: hidden;
        margin: 10px 0;
      }
      
      .health-fill {
        background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
        height: 100%;
        transition: width 0.5s;
      }
      
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }
      
      .log {
        background: rgba(0, 0, 0, 0.3);
        padding: 15px;
        border-radius: 10px;
        max-height: 200px;
        overflow-y: auto;
        margin-top: 20px;
      }
      
      .log-entry {
        padding: 5px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .selection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
        margin: 20px 0;
      }
      
      .selection-card {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
        border: 2px solid transparent;
      }
      
      .selection-card:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }
      
      .selection-card.selected {
        border-color: #4ade80;
        background: rgba(74, 222, 128, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
