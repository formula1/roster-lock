<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#dbeafe"/>
  <!-- Head -->
  <circle cx="100" cy="112" r="62" fill="#3b82f6"/>
  <!-- Eyes (alert) -->
  <circle cx="80" cy="103" r="10" fill="#0f1f40"/>
  <circle cx="120" cy="103" r="10" fill="#0f1f40"/>
  <circle cx="83" cy="100" r="4" fill="white"/>
  <circle cx="123" cy="100" r="4" fill="white"/>
  <!-- Confident smile -->
  <path d="M76 128 Q100 146 124 128" stroke="#0f1f40" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="63" cy="120" r="10" fill="#60a5fa" opacity="0.5"/>
  <circle cx="137" cy="120" r="10" fill="#60a5fa" opacity="0.5"/>
  <!-- Speed lines -->
  <g stroke="#93c5fd" stroke-width="2.5" opacity="0.6">
    <line x1="16" y1="90" x2="38" y2="90"/>
    <line x1="20" y1="110" x2="40" y2="107"/>
    <line x1="16" y1="70" x2="36" y2="73"/>
  </g>
  <!-- Outline -->
  <circle cx="100" cy="112" r="62" fill="none" stroke="#1d4ed8" stroke-width="4"/>
</svg>
