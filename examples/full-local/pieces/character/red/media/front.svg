<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Body (slimmer - fast attacker) -->
  <ellipse cx="60" cy="72" rx="24" ry="26" fill="#ef4444"/>
  <!-- Head -->
  <circle cx="60" cy="38" r="24" fill="#ef4444"/>
  <!-- Eyes (intense) -->
  <circle cx="52" cy="34" r="5" fill="#1a0000"/>
  <circle cx="68" cy="34" r="5" fill="#1a0000"/>
  <circle cx="53" cy="33" r="2" fill="white"/>
  <circle cx="69" cy="33" r="2" fill="white"/>
  <!-- Frown / determined expression -->
  <path d="M51 46 Q60 43 69 46" stroke="#1a0000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="44" cy="42" r="5" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="76" cy="42" r="5" fill="#ff6b6b" opacity="0.5"/>
  <!-- Arms (raised / aggressive) -->
  <ellipse cx="22" cy="62" rx="9" ry="14" fill="#ef4444" transform="rotate(-25 22 62)"/>
  <ellipse cx="98" cy="62" rx="9" ry="14" fill="#ef4444" transform="rotate(25 98 62)"/>
  <!-- Legs -->
  <ellipse cx="50" cy="98" rx="9" ry="13" fill="#c0392b"/>
  <ellipse cx="70" cy="98" rx="9" ry="13" fill="#c0392b"/>
  <!-- Outline -->
  <circle cx="60" cy="38" r="24" fill="none" stroke="#9b2335" stroke-width="2"/>
  <ellipse cx="60" cy="72" rx="24" ry="26" fill="none" stroke="#9b2335" stroke-width="2"/>
</svg>

