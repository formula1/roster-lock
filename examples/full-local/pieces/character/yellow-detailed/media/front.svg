<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="yellowFrontBody" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="60%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f5c800"/>
    </radialGradient>
    <radialGradient id="yellowFrontHead" cx="38%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="60%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#c8a000"/>
    </radialGradient>
  </defs>
  <!-- Soft ground shadow -->
  <ellipse cx="60" cy="112" rx="34" ry="5" fill="#5a4700" opacity="0.15"/>
  <!-- Body -->
  <ellipse cx="60" cy="70" rx="32" ry="28" fill="url(#yellowFrontBody)"/>
  <!-- Chest emblem -->
  <path d="M60 60 L64 68 L72 69 L66 75 L68 83 L60 78 L52 83 L54 75 L48 69 L56 68 Z" fill="#ffffff" opacity="0.8"/>
  <!-- Head -->
  <circle cx="60" cy="38" r="26" fill="url(#yellowFrontHead)"/>
