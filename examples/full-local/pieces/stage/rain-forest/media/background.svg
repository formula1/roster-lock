<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Sky (stormy) -->
  <rect width="800" height="450" fill="#2e5a1c"/>
  <rect width="800" height="160" fill="#4a7c3f" opacity="0.9"/>
  <!-- Dark clouds -->
  <ellipse cx="150" cy="50"  rx="140" ry="45" fill="#3d5a34" opacity="0.95"/>
  <ellipse cx="450" cy="35"  rx="180" ry="50" fill="#2e472a" opacity="0.9"/>
  <ellipse cx="700" cy="60"  rx="120" ry="40" fill="#3d5a34" opacity="0.85"/>
  <!-- Distant tree canopy -->
  <ellipse cx="100" cy="220" rx="90"  ry="70" fill="#1a5c0a"/>
  <ellipse cx="250" cy="200" rx="110" ry="85" fill="#1e6b0d"/>
  <ellipse cx="450" cy="190" rx="130" ry="90" fill="#1a5c0a"/>
  <ellipse cx="650" cy="210" rx="100" ry="75" fill="#1e6b0d"/>
  <ellipse cx="780" cy="225" rx="80"  ry="65" fill="#1a5c0a"/>
  <!-- Tree trunks -->
  <rect x="88"  y="270" width="20" height="180" fill="#3e2b1a"/>
  <rect x="238" y="260" width="22" height="190" fill="#3e2b1a"/>
  <rect x="438" y="250" width="24" height="200" fill="#3e2b1a"/>
  <rect x="638" y="265" width="20" height="185" fill="#3e2b1a"/>
  <!-- Ground (muddy) -->
  <rect y="400" width="800" height="50" fill="#4a3728"/>
  <rect y="390" width="800" height="20" fill="#5c4535" opacity="0.7"/>
  <!-- Rain streaks -->
  <g stroke="#a8d8f0" stroke-width="1.5" opacity="0.45">
    <line x1="60"  y1="0" x2="40"  y2="160"/>
    <line x1="180" y1="0" x2="160" y2="160"/>
    <line x1="300" y1="0" x2="280" y2="160"/>
    <line x1="420" y1="0" x2="400" y2="160"/>
    <line x1="540" y1="0" x2="520" y2="160"/>
    <line x1="660" y1="0" x2="640" y2="160"/>
    <line x1="780" y1="0" x2="760" y2="160"/>
    <line x1="120" y1="0" x2="100" y2="160"/>
    <line x1="240" y1="0" x2="220" y2="160"/>
    <line x1="360" y1="0" x2="340" y2="160"/>
    <line x1="480" y1="0" x2="460" y2="160"/>
    <line x1="600" y1="0" x2="580" y2="160"/>
    <line x1="720" y1="0" x2="700" y2="160"/>
  </g>
</svg>

