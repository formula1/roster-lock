<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Stormy sky -->
  <rect width="200" height="200" fill="#2e5a1c"/>
  <rect width="200" height="70" fill="#4a7c3f" opacity="0.9"/>
  <!-- Tree canopy -->
  <ellipse cx="50" cy="95" rx="45" ry="38" fill="#1a5c0a"/>
  <ellipse cx="130" cy="85" rx="55" ry="42" fill="#1e6b0d"/>
  <!-- Tree trunks -->
  <rect x="42" y="120" width="10" height="70" fill="#3e2b1a"/>
  <rect x="122" y="112" width="12" height="78" fill="#3e2b1a"/>
  <!-- Ground -->
  <rect y="178" width="200" height="22" fill="#4a3728"/>
  <!-- Rain streaks -->
  <g stroke="#a8d8f0" stroke-width="2" opacity="0.45">
    <line x1="20" y1="0" x2="10" y2="60"/>
    <line x1="70" y1="0" x2="60" y2="60"/>
    <line x1="160" y1="0" x2="150" y2="60"/>
    <line x1="190" y1="0" x2="180" y2="60"/>
  </g>
</svg>
