<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Sky -->
  <rect width="800" height="280" fill="#87ceeb"/>
  <!-- Sun -->
  <circle cx="650" cy="80" r="55" fill="#ffe066" opacity="0.95"/>
  <!-- Sun rays -->
  <g stroke="#ffe066" stroke-width="4" opacity="0.7">
    <line x1="650" y1="10" x2="650" y2="0"/>
    <line x1="700" y1="30" x2="710" y2="20"/>
    <line x1="720" y1="80" x2="732" y2="80"/>
    <line x1="700" y1="130" x2="710" y2="140"/>
    <line x1="650" y1="148" x2="650" y2="160"/>
    <line x1="600" y1="130" x2="590" y2="140"/>
    <line x1="578" y1="80" x2="566" y2="80"/>
    <line x1="600" y1="30" x2="590" y2="20"/>
  </g>
  <!-- Ocean -->
  <rect y="250" width="800" height="100" fill="#1e90ff" opacity="0.8"/>
  <rect y="260" width="800" height="10" fill="#63b3ed" opacity="0.5"/>
  <!-- Sand -->
  <rect y="340" width="800" height="110" fill="#f5deb3"/>
  <!-- Sand texture -->
  <ellipse cx="200" cy="380" rx="60" ry="8" fill="#e8cfa0" opacity="0.6"/>
  <ellipse cx="550" cy="410" rx="80" ry="6" fill="#e8cfa0" opacity="0.6"/>
  <!-- Palm tree -->
  <rect x="120" y="200" width="12" height="140" fill="#8b6340"/>
  <ellipse cx="126" cy="200" rx="48" ry="22" fill="#228b22"/>
  <ellipse cx="95"  cy="215" rx="40" ry="16" fill="#2d9e2d"/>
  <ellipse cx="158" cy="212" rx="38" ry="15" fill="#1a7a1a"/>
</svg>

