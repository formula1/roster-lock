name: full-local-example

networks:
  match-lock-network:
    driver: bridge

services:
  # ========================================================================
  # DOWNLOAD PROVIDER - Serves piece tarballs and file listings
  # ========================================================================
  download-provider:
    build:
      context: ../..
      dockerfile: examples/services/download-provider/folder-tar/Dockerfile
    ports:
      - "7342:80"
    environment:
      - NODE_ENV=development
      - PORT=80
      - PIECES_DIR=/pieces
    networks:
      - match-lock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./pieces:/pieces:ro


  # ========================================================================
  # RELAY SERVER - Cloudflare Workers-compatible relay using Hono
  # ========================================================================
  relay-room:
    build:
      context: ../..
      dockerfile: core/relay-server/Dockerfile
    ports:
      - "7343:80"  # Main server port
    environment:
      - NODE_ENV=development
      - PORT=80
      - ENVIRONMENT=development
    env_file:
      - ./services/env-vars/internal-urls.env
      - ./services/env-vars/relay.env
    networks:
      - match-lock-network
    depends_on:
      - game-coordinator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================================================================
  # MATCHMAKING SERVER - Simple queue-based matchmaking
  # ========================================================================
  match-maker:
    build:
      context: ../..
      dockerfile: examples/full-local/services/matchmaking/Dockerfile
    ports:
      - "7344:80"
    environment:
      - NODE_ENV=development
      - PORT=80
    env_file:
      - ./services/env-vars/internal-urls.env
      - ./services/env-vars/match-maker.env
    networks:
      - match-lock-network
    depends_on:
      relay-room:
        condition: service_healthy
      game-coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================================================================
  # GAME SERVER - WebRTC signaling and game coordination
  # ========================================================================
  game-coordinator:
    build:
      context: ../..
      dockerfile: examples/full-local/services/game-server/Dockerfile
    ports:
      - "7345:80"
    environment:
      - NODE_ENV=development
      - PORT=80
    env_file:
      - ./services/env-vars/internal-urls.env
      - ./services/env-vars/game-coordinator.env
    networks:
      - match-lock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

