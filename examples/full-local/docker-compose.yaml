name: full-local-example

networks:
  match-lock-network:
    driver: bridge

services:
  # ========================================================================
  # DOWNLOAD PROVIDER - Serves piece tarballs and file listings
  # ========================================================================
  download-provider:
    build:
      context: ./services/download-provider
      dockerfile: Dockerfile
    ports:
      - "7342:80"
    environment:
      - NODE_ENV=development
      - PORT=80
      - PIECES_DIR=/pieces
    networks:
      - match-lock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./services/download-provider:/app
      - /app/node_modules
      - ./pieces:/pieces:ro


  # ========================================================================
  # RELAY SERVER - Cloudflare Workers-compatible relay using Hono
  # ========================================================================
  relay-room:
    build:
      context: ../../core/relay-server
      dockerfile: Dockerfile
    ports:
      - "8081:80"  # Main server port
    environment:
      - NODE_ENV=development
      - PORT=80
      - ENVIRONMENT=development
    env_file:
      - ./services/env-vars/internal-urls.env
      - ./services/env-vars/relay.env
    networks:
      - match-lock-network
    depends_on:
      - game-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ../../core/relay-server:/app
      - /app/node_modules
      - /app/client/node_modules

  # ========================================================================
  # MATCHMAKING SERVER - Simple queue-based matchmaking
  # ========================================================================
  match-maker:
    build:
      context: ./services/matchmaking
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    environment:
      - NODE_ENV=development
      - PORT=80
    env_file:
      - ./services/env-vars/internal-urls.env
      - ./services/env-vars/match-maker.env
    networks:
      - match-lock-network
    depends_on:
      relay-server:
        condition: service_healthy
      game-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./services/matchmaking:/app
      - /app/node_modules

  # ========================================================================
  # GAME SERVER - WebRTC signaling and game coordination
  # ========================================================================
  game-coordinator:
    build:
      context: ./services/game-server
      dockerfile: Dockerfile
    ports:
      - "8083:80"
    environment:
      - NODE_ENV=development
      - PORT=80
    env_file:
      - ./services/env-vars/internal-urls.env
      - ./services/env-vars/game-coordinator.env
    networks:
      - match-lock-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./services/game-server:/app
      - /app/node_modules

